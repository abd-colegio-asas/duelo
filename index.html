.card.dim{opacity:.5}
.card.ready{border-color:var(--gold)}

.card.tgt{border-color:var(--red);cursor:pointer}
.card.can{cursor:pointer;border-color:var(--blue)}

button.sq{width:38px;padding:8px 0;background:var(--bone)}
button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{opacity:.4}

details{font-size:13px;opacity:.9}summary{cursor:pointer}
.end{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;padding:20px}
.end div{background:var(--bone);color:var(--ink);padding:24px;border-radius:14px;text-align:center;font-size:20px;font-weight:800;display:flex;flex-direction:column;gap:14px}
.end small{font-size:14px;font-weight:500}
</style></head><body><div id="app"></div>
